<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" fill="none">
  <!-- Steering Wheel Icon -->
  <g transform="translate(5, 5)">
    <!-- Outer ring -->
    <circle cx="20" cy="20" r="18" stroke="white" stroke-width="3" fill="none"/>
    <!-- Inner circle (hub) -->
    <circle cx="20" cy="20" r="5" stroke="white" stroke-width="2" fill="none"/>
    <!-- Spokes -->
    <line x1="20" y1="2" x2="20" y2="15" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="4.4" y1="29" x2="15.5" y2="22.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35.6" y1="29" x2="24.5" y2="22.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- "Rent" text -->
  <text x="52" y="34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="white">Rent</text>
  <!-- "Ride" text in green -->
  <text x="120" y="34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#4CAF50">Ride</text>
</svg>

